{% extends 'eshop/header.html' %}
{% load static %}
{% block content %}

<div class="container mt-5">

    <!-- SEARCH BAR -->
    <div class="position-relative" style="max-width: 600px; margin: auto;">
        <div class="input-group mb-3">
            <input type="text" id="searchInput" class="form-control" placeholder="Search a product...">
            <button class="btn btn-secondary" type="button" id="searchButton">Recherche</button>
            <button class="btn btn-outline-secondary" type="button" id="clearNormalSearch">⌫</button>
        </div>

        <!-- LIVE SEARCH RESULTS -->
        <ul id="liveResults" class="list-group position-absolute w-100 shadow-sm rounded" 
            style="z-index: 1000; max-height: 250px; overflow-y: auto; display: none;"></ul>
    </div>

    <!-- FULL RESULTS -->
    <div class="mt-4">
        <div id="results" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
    </div>

</div>




<script src="{% static 'JavaScript/product_search.js' %}"></script>

{% endblock %}
