{% extends "eshop/header.html" %}
{% block content %}

<div class="container mt-5">
    <h1 class="mb-4">Paramètres AI</h1>

    <form method="post" class="card p-4 shadow-sm bg-light rounded">
        {% csrf_token %}

        <!-- Champ modèle -->
        <div class="mb-3">
            <label for="{{ form.aiModel.id_for_label }}" class="form-label fw-bold">
                Modèle
            </label>
            {{ form.aiModel }}
        </div>
        
        <div class="mb-3">
            <label for="{{ form.temperature.id_for_label }}" class="form-label fw-bold">
                Temperature (Taux de précision de la réponse)
            </label>
            {{ form.temperature }}
        
            <br>
        
            <label for="{{ form.num_predict.id_for_label }}" class="form-label fw-bold">
                Max. de caractères
            </label>
            {{ form.num_predict }}
        </div>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
    </form>

    <!-- Section info recommandée -->
    <div class="mt-4 p-3 bg-danger text-white rounded shadow-sm">
        <h5>Paramètres recommandés :</h5>
        <ul class="mb-1">
            <li><strong>Modèle :</strong>{{ ai_data.aiModel }}</li>
            <li><strong>Temperature :</strong></li>
            <li><strong>Limite de caractères :</strong></li>
        </ul>
    </div>
</div>

<div class="text-center mt-4 mb-5">
    <a href="{% url 'product_list' %}" class="btn btn-outline-secondary">
        Retour à la liste
    </a>
</div>

{% endblock %}
