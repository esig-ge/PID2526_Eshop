{% extends "eshop/header.html" %}
{% block content %}
<div class="container my-5" style="max-width: 720px;">
  <h2 class="mb-4">Informations de livraison</h2>

  <form method="post">
    {% csrf_token %}

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Prénom</label>
        <input name="first_name" class="form-control" required value="{{ data.first_name|default:'' }}">
      </div>

      <div class="col-md-6">
        <label class="form-label">Nom</label>
        <input name="last_name" class="form-control" required value="{{ data.last_name|default:'' }}">
      </div>

      <div class="col-12">
        <label class="form-label">Adresse</label>
        <input name="address_line1" class="form-control" required value="{{ data.address_line1|default:'' }}">
      </div>

      <div class="col-12">
        <label class="form-label">Complément (optionnel)</label>
        <input name="address_line2" class="form-control" value="{{ data.address_line2|default:'' }}">
      </div>

      <div class="col-md-4">
        <label class="form-label">NPA</label>
        <input name="postal_code" class="form-control" required value="{{ data.postal_code|default:'' }}">
      </div>

      <div class="col-md-5">
        <label class="form-label">Ville</label>
        <input name="city" class="form-control" required value="{{ data.city|default:'' }}">
      </div>

      <div class="col-md-3">
        <label class="form-label">Pays</label>
        <input name="country" class="form-control" value="{{ data.country|default:'CH' }}" required>
      </div>
    </div>

    {% if error %}
      <div class="alert alert-danger mt-3">{{ error }}</div>
    {% endif %}

    <div class="d-flex justify-content-between mt-4">
      <a href="{% url 'cart_detail' %}" class="btn btn-secondary">Retour panier</a>
      <button type="submit" class="btn btn-success">Continuer vers paiement</button>
    </div>
  </form>
</div>
{% endblock %}
