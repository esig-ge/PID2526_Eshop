<!DOCTYPE html>
<html>
<head>

</head>
<body>
    <div class="header">
        <h1>FACTURE - Commande N°{{ order.id }}</h1>
        <p>Date : {{ order.created_at|date:"d/m/Y" }}</p>
    </div>

    <table>
        <thead>
            <tr>
                <th>Produit</th>
                <th>Quantité</th>
                <th>Prix Unitaire</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            {% for item in order.items.all %}
            <tr>
                <td>{{ item.product.name }}</td>
                <td>{{ item.quantity }}</td>
                <td>{{ item.price }} €</td>
                <td>{{ item.get_cost }} €</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <p class="total">Total à payer : {{ order.get_total_cost }} €</p>
</body>
</html>
