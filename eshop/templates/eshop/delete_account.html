{% extends 'eshop/header.html' %}

{% block content %}
<div class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                    <!-- <i class="fa-solid fa-triangle-exclamation fs-1 mb-2"></i> -->
                    <h3 class="mb-0 fw-semibold ">Suppression de compte</h3>
                </div>
                
                <div class="card-body p-4 p-md-5 text-center">
                    <h4 class="fw-semibold text-dark mb-3">Êtes-vous sûr ?</h4>
                    
                    <p class="text-danger mb-4">
                        <strong>{{ user.username }}</strong>, la suppression de votre compte est définitive et irréversible. Toutes vos données seront effacées.
                    </p>
                    
                    <form method="POST" action="{% url 'delete_account' %}">
                        {% csrf_token %}
                        <div class="d-grid gap-3 mt-4">
                            <button type="submit" class="btn btn-danger rounded-pill fw-semibold shadow-sm">
                                Oui, supprimer définitivement
                            </button>
                            <a href="{% url 'profile' %}" class="btn btn-outline-secondary rounded-pill fw-semibold">
                                Non, annuler
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
