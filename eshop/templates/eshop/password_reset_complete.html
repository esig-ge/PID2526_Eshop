{% extends 'eshop/header.html' %}

{% block content %}
<div class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-success text-white text-center py-3 rounded-top-4">
                    <h3 class="mb-0 fw-bold">Mot de passe réinitialisé</h3>
                </div>
                <div class="card-body p-4 p-md-5 text-center">
                    <div class="mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-check-circle-fill text-success" viewBox="0 0 16 16">
                          <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                        </svg>
                    </div>
                    <p class="mb-0 fs-5">Votre mot de passe a été réinitialisé avec succès.</p>
                </div>
                <div class="card-footer bg-light text-center py-4 rounded-bottom-4 border-top-0">
                    <a href="{% url 'login' %}" class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm px-5">Se connecter</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
